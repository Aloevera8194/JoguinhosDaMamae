name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Recria keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JOGUINHOS_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/joguinhos-release.keystore

      - name: Build APK Release
        env:
          JOGUINHOS_KEYSTORE_PASSWORD: ${{ secrets.JOGUINHOS_KEYSTORE_PASSWORD }}
        run: bash gradlew assembleRelease

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/JoguinhosDaMamae-v${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoguinhosDaMamae-release
          path: output/*.apk
